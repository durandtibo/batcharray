name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Load the version bounds from dev/config/package_versions.json.
  get-versions:
    uses: ./.github/workflows/lib-get-package-versions.yaml

  # Load the shared python-version/OS matrix from durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install batcharray"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "batcharray[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre batcharray"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "batcharray[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      install-args: "--pre"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  ########################
  #     Dependencies     #
  ########################

  # batcharray has no optional dependencies: test its required dependencies.
  coola:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: coola
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).coola) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  numpy:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: numpy
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).numpy) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
